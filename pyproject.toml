# mysqlclient (from apache-airflow-providers-mysql on Linux) has no manylinux wheels.
# script/setup uses pyenv + .python-version for Python.h checks and `uv sync --python`.
# Building mysqlclient needs libmariadb-dev; otherwise use PyMySQL / mysql-connector-python.

[project]
name = "fantasy-sports-airflow"
version = "0.1.0"
description = "Airflow 3 DAGs and task dependencies for fantasy-sports"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.1.8",
    "apache-airflow-providers-celery",
    "apache-airflow-providers-fab",
    "apache-airflow-providers-mysql",
    "apache-airflow-providers-standard",
    "pandas",
    "numpy",
    "beautifulsoup4",
    "lxml",
    "html5lib",
    "requests",
    "playwright==1.53.0",
    "SQLAlchemy",
    "pymysql",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "dags"]
addopts = [
    "-ra",
    "--tb=short",
    "--cov=include",
    "--cov=dags",
    "--cov=airflow_utils",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=30",
]

[tool.coverage.run]
source = ["include", "dags", "airflow_utils"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
precision = 1
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "logs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.uv]
package = false
