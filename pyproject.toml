# mysqlclient (from apache-airflow-providers-mysql on Linux) has no manylinux wheels.
# script/setup uses pyenv + .python-version for Python.h checks and `uv sync --python`.
# Building mysqlclient needs libmariadb-dev; otherwise use PyMySQL / mysql-connector-python.

[project]
name = "fantasy-sports-airflow"
version = "0.1.0"
description = "Airflow 3 DAGs and task dependencies for fantasy-sports"
requires-python = ">=3.12"
dependencies = [
    "apache-airflow==3.1.8",
    "apache-airflow-providers-celery",
    "apache-airflow-providers-fab",
    "apache-airflow-providers-mysql",
    "apache-airflow-providers-standard",
    "pandas",
    "numpy",
    "beautifulsoup4",
    "lxml",
    "html5lib",
    "requests",
    "playwright==1.53.0",
    "SQLAlchemy",
    "pymysql",
    "scikit-learn>=1.8.0",
    "xgboost>=3.2.0",
    "boruta>=0.4.3",
    "ortools>=9.14.0",
    # Used by include/nascar/ml/train_task.py for cohort process isolation
    # inside the Airflow Celery worker. Billiard is Celery's existing fork
    # of multiprocessing; it omits the ``daemonic processes are not allowed
    # to have children`` assertion that blocks stdlib's spawn under
    # Celery's prefork worker. Version intentionally unpinned so we
    # inherit whatever Celery requires.
    "billiard",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-beautifulsoup4>=4.12.0",
    "vulture>=2.14",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = [".", "dags"]
markers = [
    "regression: targeted regression tests for known importer defects",
    "integration: tests that require a live MariaDB (AIRFLOW_CONN_NASCAR_CONN)",
]
addopts = [
    "-ra",
    "--tb=short",
    "--cov=include",
    "--cov=dags",
    "--cov=airflow_utils",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
    "--cov-fail-under=30",
]

[tool.coverage.run]
source = ["include", "dags", "airflow_utils"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
precision = 1
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    "logs",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["dags", "include", "airflow_utils"]
mypy_path = "dags"
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.vulture]
paths = ["dags", "include", "airflow_utils"]
exclude = [".venv", ".git", ".pytest_cache", "tests", "script"]
min_confidence = 80
ignore_decorators = [
    "@app.task",
    "@task",
    "@dag",
    "@pytest.fixture",
]

[tool.uv]
package = false
