# Basic Airflow cluster configuration for CeleryExecutor with Redis and PostgreSQL.
#
# WARNING: This configuration is for local development. Do not use it in a production deployment.
#
# This configuration supports basic configuration using environment variables or an .env file
# The following variables are supported:
#
# AIRFLOW_IMAGE_NAME           - Docker image name used to run Airflow.
#                                Default: apache/airflow:3.1.8
# AIRFLOW_UID                  - User ID in Airflow containers
#                                Default: 50000
# AIRFLOW_PROJ_DIR             - Base path to which all the files will be volumed.
#                                Default: .
# AIRFLOW_SCRAPER_DATA_DIR     - Host directory bind-mounted to /home/airflow/scraper (gitignored by default).
#                                Scrape files live under <that>/nascar/… Default: ${AIRFLOW_PROJ_DIR}/scraper-data
# AIRFLOW_DFS_DATA_DIR         - Host directory bind-mounted to /home/airflow/dfs (DraftKings/FanDuel CSV drops).
#                                Default: ${AIRFLOW_PROJ_DIR}/dfs-data
# FANTASY_SPORTS_DB_BUILD_CONTEXT - Path to fantasy-sports-db repo (Docker build context for MariaDB).
#                                Default: ../fantasy-sports-db (sibling of this project)
# FANTASY_SPORTS_DB_IMAGE      - Image name/tag for the DB image built from that context.
#                                Default: fantasy-sports-db:latest
# FS_ENABLE_BACKFILL_DAGS      - When 1/true/yes/on, register backfill.* Cup DAGs in the UI.
#                                Default: 0 (hidden). Set in .env; passed through to Airflow services.
# AIRFLOW__CORE__DEFAULT_TIMEZONE - DAG scheduling timezone (default: utc in compose).
# TZ                          - Container OS timezone for logs (default: UTC in compose).
# Those configurations are useful mostly in case of standalone testing/running Airflow in test/try-out mode
#
# _AIRFLOW_WWW_USER_USERNAME   - Username for the administrator account (if requested).
#                                Default: airflow
# _AIRFLOW_WWW_USER_PASSWORD   - Password for the administrator account (if requested).
#                                Default: airflow
# _PIP_ADDITIONAL_REQUIREMENTS - Additional PIP requirements to add when starting all containers.
#                                Use this option ONLY for quick checks. Installing requirements at container
#                                startup is done EVERY TIME the service is started.
#                                A better way is to build a custom image or extend the official image
#                                as described in https://airflow.apache.org/docs/docker-stack/build.html.
#                                Default: ''
#
# Feel free to modify this file to suit your needs.
---
x-airflow-common:
  &airflow-common
  # Custom image (Playwright, MySQL client libs, providers) — build before first up: docker compose build
  image: ${AIRFLOW_IMAGE_NAME:-fantasy-sports-airflow:latest}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    TZ: UTC
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-api-server:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret_change_me}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # Custom config (includes [core] default_timezone = utc); env vars above take precedence.
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    PYTHONPATH: /opt/airflow
    # Provider compat layer still imports deprecated permissions; safe to ignore until upstream moves.
    PYTHONWARNINGS: 'ignore::airflow.exceptions.RemovedInAirflow4Warning'
    # Charset + collation → connection extra; NascarMySqlHook passes them to the driver (mysqlclient / connector).
    AIRFLOW_CONN_MARIADB_CONN: "mariadb://username:password@mariadb:3306/nascar?charset=utf8mb4&collation=utf8mb4_uca1400_ai_ci"
    AIRFLOW_CONN_NASCAR_CONN: "mariadb://username:password@mariadb:3306/nascar?charset=utf8mb4&collation=utf8mb4_uca1400_ai_ci"
    FS_ENABLE_BACKFILL_DAGS: ${FS_ENABLE_BACKFILL_DAGS:-0}
    FS_MC_N_SIMULATIONS: ${FS_MC_N_SIMULATIONS:-1000}
    FS_MC_RANDOM_SEED: ${FS_MC_RANDOM_SEED:-}
    FS_DK_MC_OBJECTIVE: ${FS_DK_MC_OBJECTIVE:-p50}
    FS_ML_MIN_COHORT_WEEKS: ${FS_ML_MIN_COHORT_WEEKS:-2}
    FS_ML_BLEND_WEIGHTS: ${FS_ML_BLEND_WEIGHTS:-inverse_mae}
    FS_ML_DEV_WEEKS: ${FS_ML_DEV_WEEKS:-1}
    FS_ML_STRICT_FEATURES: ${FS_ML_STRICT_FEATURES:-0}
    FS_ML_PRIMARY_RANK_OBJECTIVE: ${FS_ML_PRIMARY_RANK_OBJECTIVE:-0}
    FS_ML_INTERVAL_METHOD: ${FS_ML_INTERVAL_METHOD:-conformal}
    # Memory tuning (12 GB / 4-core worker default). XGBoost ``tree_method='hist'``
    # allocates per-thread histogram buffers; capping the BLAS / OpenMP thread
    # count from 4 -> 2 halves that peak and leaves room for the Python parent
    # process. Override per-deployment via .env when running on a larger host.
    OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
    MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
    OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
    # Hyperparameter search budget (Phase 1 of the OOM mitigation): lowered from
    # 25 / 4 to 15 / 3 cuts the worst-case CV fit count per target from 100 to
    # 45 while leaving the search wide enough for the cohort sizes we hit.
    FS_ML_TUNE_N_ITER: ${FS_ML_TUNE_N_ITER:-15}
    FS_ML_TUNE_CV_SPLITS: ${FS_ML_TUNE_CV_SPLITS:-3}
    # Boruta + XGBoost intra-task parallelism (Phase 4): drops Boruta's iteration
    # cap from 50 -> 30 and pins XGBoost ``n_jobs`` to 2 to match the OpenMP cap
    # above. Set FS_ML_XGB_N_JOBS=1 as the next lever if cohorts still spike.
    FS_ML_BORUTA_MAX_ITER: ${FS_ML_BORUTA_MAX_ITER:-30}
    FS_ML_BORUTA_SMALL_COHORT_MAX_ITER: ${FS_ML_BORUTA_SMALL_COHORT_MAX_ITER:-10}
    FS_ML_XGB_N_JOBS: ${FS_ML_XGB_N_JOBS:-2}
    # XGBoost execution device for cohort training. Default ``cpu`` keeps
    # the legacy ``tree_method='hist'`` CPU path; ``cuda`` (or ``cuda:N``
    # for a specific GPU index) routes the same boosters through the GPU
    # histogram method. Requires nvidia-container-toolkit on the host
    # plus the ``deploy.resources.reservations.devices`` block on the
    # services below; ``predict`` and ``monte_carlo`` are CPU-only and
    # don't read this knob. See
    # docs/nascar/cup.machine_learning.models.md "GPU acceleration".
    FS_ML_XGB_DEVICE: ${FS_ML_XGB_DEVICE:-cpu}
    # Cap the cohort's training horizon at ``FS_ML_MAX_TRAIN_WEEKS`` most-recent
    # weeks (unset = all available history). Trim aggressively when a future
    # cohort grows unexpectedly large; the SQL window subselect keeps the DB
    # filter cheap. See docs/nascar/cup.machine_learning.models.md "Memory
    # tuning" for the full pressure-release order.
    FS_ML_MAX_TRAIN_WEEKS: ${FS_ML_MAX_TRAIN_WEEKS:-}
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/airflow_utils:/opt/airflow/airflow_utils
    - ${AIRFLOW_PROJ_DIR:-.}/include:/opt/airflow/include
    # Mount parent dir so host sees scraper-data/nascar/… (see DEFAULT_NASCAR_SCRAPER_ROOT in racing_reference.py)
    - ${AIRFLOW_SCRAPER_DATA_DIR:-${AIRFLOW_PROJ_DIR:-.}/scraper-data}:/home/airflow/scraper
    - ${AIRFLOW_DFS_DATA_DIR:-${AIRFLOW_PROJ_DIR:-.}/dfs-data}:/home/airflow/dfs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
      # Recycle the Celery prefork child after each task so the next task
      # starts with a clean glibc heap. ``build_ml_training_snapshots`` and
      # ``train_models_if_needed`` are the two main offenders: the former
      # allocates GBs of transient feature dicts while rebuilding hundreds
      # of week snapshots, and glibc's per-arena pinning keeps those
      # mappings resident long after the task returns. Without this knob,
      # the next task on the same worker child sees a polluted heap that
      # tips the cgroup limit. ``=1`` is the canonical Celery memory-leak
      # workaround; cost per task is one fork() (~ms, COW-cheap on Linux).
      AIRFLOW__CELERY__WORKER_MAX_TASKS_PER_CHILD: ${AIRFLOW__CELERY__WORKER_MAX_TASKS_PER_CHILD:-1}
      # Run each ML cohort's frame load + train in a spawned subprocess so
      # the per-cohort working set (Boruta shadow matrix, XGBoost models,
      # feature dicts) is reclaimed by the OS on child exit. Belt-and-
      # suspenders with the worker-recycle knob above: that one resets
      # heap between tasks, this one resets it between cohorts inside the
      # same task. Set to 0 to fall back to the legacy in-process path
      # (tests / local debugging).
      FS_ML_TRAIN_COHORT_ISOLATION: ${FS_ML_TRAIN_COHORT_ISOLATION:-1}
    # GPU passthrough for ``train_models_if_needed`` (XGBoost
    # ``device=cuda``). Inert when FS_ML_XGB_DEVICE=cpu (the default) and
    # ignored entirely when the host has no nvidia-container-toolkit
    # installed — Compose accepts the block but Docker only honors it
    # once the ``nvidia`` runtime is registered. Worker is the only
    # Airflow service that actually fits estimators, so the scheduler /
    # api-server / dag-processor / triggerer don't need GPU access.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-api-server:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}
        exec /entrypoint airflow version
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "5555:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
  unit-tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: Dockerfile.unit-tests
    image: ${UNIT_TESTS_IMAGE:-fantasy-sports-airflow-unit-tests:latest}
    command: ["python", "-m", "pytest"]
    # Mirror the worker's GPU reservation so GPU-tagged tests (currently
    # only the env-var resolution tests in test_memory_tuning.py) can
    # opt in without a separate compose override. The block is inert
    # unless ``nvidia-container-toolkit`` is installed on the host; the
    # actual pytest suite is CPU-only by default and doesn't need a GPU
    # to pass.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  mariadb:
    build:
      context: ${FANTASY_SPORTS_DB_BUILD_CONTEXT:-../fantasy-sports-db}
      dockerfile: Dockerfile
    image: ${FANTASY_SPORTS_DB_IMAGE:-fantasy-sports-db:latest}
    container_name: ${MARIADB_CONTAINER_NAME:-mariadb}
    restart: always
    environment:
      TZ: UTC
      MARIADB_MYSQL_LOCALHOST_USER: true
      MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DATABASE_NAME:-nascar}
      MYSQL_USER: ${DATABASE_USER:-username}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-password}
    ports:
      - ${DATABASE_PORT:-3306}:3306
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      timeout: 1s
      retries: 120
    volumes:
      - maria-db-volume:/var/lib/mysql

volumes:
  postgres-db-volume:
  maria-db-volume:

